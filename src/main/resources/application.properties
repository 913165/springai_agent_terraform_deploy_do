spring.application.name=spring_ai_mcp_mysql002

# Provide API key through environment variable OPENAI_API_KEY.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.1

# MCP disabled so the app can start for the deploy chat UI.
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers.json
spring.ai.mcp.client.toolcallback.enabled=false

# Terraform working directory (relative to process cwd = project root when run from IDE/Maven)
app.terraform.dir=terraform
# Full path required when terraform is not on PATH (Windows ProcessBuilder does not search PATH the same way as a shell)
app.terraform.executable=C:/temp/kubeconfig/terraform.exe
app.terraform.timeout-minutes=15

# Jenkins terraform trigger directory (null_resource local-exec -> Jenkins build)
app.jenkins.terraform.dir=jenkins_dir

# Console logging for chat + tool calls
logging.level.root=INFO
logging.level.org.example.springai_agent_terraform_deploy_do=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# port 8081
server.port=8081